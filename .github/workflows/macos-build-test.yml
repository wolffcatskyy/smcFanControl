name: macOS build and tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Portable C test (release version parsing)
        run: |
          clang -std=c99 -Wall -Wextra -o /tmp/test_release_version tests/test_release_version.c
          /tmp/test_release_version

      - name: Diagnostic redaction tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build app (x86_64)
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild -project smcFanControl.xcodeproj -alltargets -configuration Release \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO MACOSX_DEPLOYMENT_TARGET=10.13 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SYMROOT="$PWD/build" build 2>&1 | tee xcodebuild.log

      - name: Check architecture
        run: |
          find build -name '*.app' -maxdepth 3
          lipo -info build/Release/smcFanControl.app/Contents/MacOS/smcFanControl

      - name: Package build
        run: ditto -c -k --keepParent build/Release/smcFanControl.app smcFanControl-unsigned-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: smcFanControl-unsigned-x86_64
          path: smcFanControl-unsigned-x86_64.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
